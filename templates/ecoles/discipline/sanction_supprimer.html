{% extends 'base.html' %}

{% block title %}Supprimer une sanction{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card border-0 shadow-sm">
            <div class="card-body text-center p-4">
                <i class="bi bi-exclamation-triangle-fill text-danger" style="font-size:3rem;"></i>
                <h4 class="mt-3">Supprimer cette sanction ?</h4>
                <p class="text-muted">
                    <b>{{ sanction.get_type_sanction_display }}</b>
                    du <b>{{ sanction.date_debut|date:"d/m/Y" }}</b>
                    pour <b>{{ sanction.eleve.nom_complet }}</b>.
                </p>

                <form method="post" class="d-flex gap-2 justify-content-center mt-4">
                    {% csrf_token %}
                    <a href="{% url 'ecoles:incident_detail' sanction.incident.id %}" class="btn btn-outline-secondary">
                        <i class="bi bi-x-circle"></i> Annuler
                    </a>
                    <button type="submit" class="btn btn-danger">
                        <i class="bi bi-trash"></i> Confirmer
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
